<title>Back to the Future</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout : une borne d'arcade — écran 16:9 centré, panneau de commandes dessous. Look unique, sombre. */
:root{
  color-scheme:dark;
  --ink:#120a1f; --panel:#24143a; --line:#4a2f6e;
  --hot:#ff3d6e; --gold:#ffd23f; --steam:#7fe7ff; --crust:#f2a65a; --text:#fff4e0; --dim:#b9a6d6;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;justify-content:center}
.cab{width:min(100%,calc((100dvh - 190px) * 16 / 9));min-width:min(100%,300px);display:flex;flex-direction:column;gap:10px}
.screen{position:relative;aspect-ratio:16/9;flex-shrink:0;max-width:100%;container-type:inline-size;background:#000;
  border:3px solid var(--line);box-shadow:0 0 0 3px #000,0 0 40px #ff3d6e33;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#0000 0 2px,#0002 2px 3px)}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;
  font-family:var(--display);text-align:center;padding:2cqw}
#ovTitle{background:linear-gradient(#120a1fcc,#120a1f66 55%,#120a1fd9)}
#ovSelect,#ovWin{background:#120a1fe6}
.logo{display:flex;flex-direction:column;align-items:center;gap:1cqw;line-height:1}
.logo b{font-size:6.6cqw;font-weight:400;text-shadow:.45cqw .45cqw 0 #000,-.1cqw -.1cqw 0 #000}
.logo .a{color:var(--steam);transform:translateX(-6cqw) skewX(-8deg)}
.logo .b{color:var(--crust);transform:translateX(6cqw) skewX(-8deg)}
.logo i{font-style:normal;font-size:4.4cqw;color:var(--gold);text-shadow:.3cqw .3cqw 0 var(--hot)}
.sub{font-size:1.5cqw;color:var(--text);letter-spacing:.1em}
.btn{font-family:var(--display);font-size:2.3cqw;color:#1a0a10;background:var(--gold);border:0;padding:1.6cqw 2.6cqw;cursor:pointer;
  box-shadow:0 .5cqw 0 #b3411f,0 .5cqw 0 .3cqw #000,0 0 0 .3cqw #000}
.btn:hover{background:#fff1a8}
.btn:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 #b3411f,0 0 0 .3cqw #000}
.btn:focus-visible,.card:focus-visible,.mini:focus-visible{outline:.35cqw solid var(--steam);outline-offset:.4cqw}
.btn.big{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:#fff}}
@media (prefers-reduced-motion:reduce){.btn.big{animation:none}}
.mini{font-family:var(--display);font-size:1.35cqw;background:var(--panel);color:var(--text);border:.25cqw solid var(--line);padding:1cqw 1.4cqw;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--hot);border-color:#fff;color:#fff}
h2{font-size:2.6cqw;font-weight:400;margin:0;color:var(--gold);text-shadow:.3cqw .3cqw 0 #000}
.cards{display:flex;gap:3cqw;align-items:stretch;justify-content:center}
.card{font-family:var(--display);width:34cqw;background:var(--panel);border:.35cqw solid var(--line);color:var(--text);
  padding:1.4cqw;display:flex;flex-direction:column;align-items:center;gap:1cqw;cursor:pointer}
.card.p1{border-color:var(--steam)} .card.p2{border-color:var(--crust)}
.card .who{font-size:1.3cqw;color:var(--dim)}
.card img,.winner img{width:13cqw;height:13cqw;border:.3cqw solid #000;background:#000}
.card .nm{font-size:2cqw}
.card .tg{font-size:1.1cqw;color:var(--gold);line-height:1.5}
.card .sp{font-size:1.05cqw;color:var(--dim);line-height:1.45;height:7.7cqw;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.card .sw{font-size:1.05cqw;color:var(--text);opacity:.8}
.card img{width:6.6cqw;height:6.6cqw}
/* rangée des 4 combattants dans chaque fiche : cliquer un visage le choisit */
.roster{display:flex;gap:.6cqw;justify-content:center}
.roster span{display:block;width:3.4cqw;height:3.4cqw;border:.25cqw solid var(--line);opacity:.55;background:#000}
.roster span img{width:100%;height:100%;border:0;display:block}
.roster span.on{border-color:var(--gold);opacity:1}
.roster span:hover{opacity:1}
#ovSelect{gap:1.5cqw}
/* rangée du bas de la sélection : trois boutons de même taille */
#ovSelect .row>button{width:27cqw;height:5cqw;font-size:1.6cqw;padding:0 1cqw;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#ovSelect #btnFight{box-shadow:none;border:.25cqw solid #fff1a8}
#ovSelect #btnFight:active{transform:translateY(.2cqw)}
.maps{display:flex;gap:1.1cqw;justify-content:center}
.map{font-family:var(--display);font-size:1.05cqw;color:var(--dim);background:var(--panel);border:.3cqw solid var(--line);padding:.5cqw;display:flex;flex-direction:column;gap:.5cqw;align-items:center;cursor:pointer}
.map img{width:9.6cqw;aspect-ratio:16/9;display:block;background:#000}
.map[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.map:focus-visible{outline:.35cqw solid var(--steam);outline-offset:.4cqw}
.vs{align-self:center;font-size:3.4cqw;color:var(--hot);text-shadow:.3cqw .3cqw 0 #000}
.row{display:flex;gap:1.4cqw;align-items:center;justify-content:center;flex-wrap:wrap}
.winner{display:flex;align-items:center;gap:2.5cqw;text-align:left}
.winner .big{font-size:3.4cqw;color:var(--gold);text-shadow:.35cqw .35cqw 0 var(--hot);line-height:1.3}
.winner .q{font-family:var(--body);font-size:2.6cqw;color:var(--text);max-width:42cqw;line-height:1.1;margin-top:1cqw}
.note{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
/* trois boutons utilitaires : même taille, même couleur */
#mute,#btnRestart,#btnHome{font-size:9px;width:118px;padding:6px 8px;border:2px solid var(--line);background:var(--panel);color:var(--text);text-align:center}
#mute[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--text)}
#mute:hover,#btnRestart:hover,#btnHome:hover{background:var(--hot);border-color:var(--hot);color:#fff}
#mute:focus-visible,#btnRestart:focus-visible,#btnHome:focus-visible{outline:2px solid var(--steam);outline-offset:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keys{background:var(--panel);border:2px solid var(--line);padding:8px 10px;min-width:0}
.keys h3{font-family:var(--display);font-size:10px;font-weight:400;margin:0 0 6px;letter-spacing:.04em}
.keys.p1 h3{color:var(--steam)} .keys.p2 h3{color:var(--crust)}
.keys ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;line-height:1.25}
kbd{font-family:var(--display);font-size:9px;background:#000;border:1px solid var(--dim);border-bottom-width:3px;padding:2px 5px;color:var(--gold);margin-right:2px}
kbd.ar{font-family:system-ui,sans-serif;font-size:12px;line-height:1}
.note{grid-column:1/-1;color:var(--dim);margin:0;font-size:17px;line-height:1.2}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* croix directionnelle : une seule zone, la direction vient de la position du pouce (diagonales comprises, pour les gestes) */
.dpad{position:relative;width:min(150px,40vw);height:min(150px,40vw);border-radius:50%;background:#24143acc;border:3px solid var(--line);touch-action:none;flex:none}
.dpad .arr{position:absolute;font-size:18px;color:var(--dim);pointer-events:none}
.dpad .u{top:8px;left:50%;transform:translateX(-50%)}.dpad .d{bottom:8px;left:50%;transform:translateX(-50%)}
.dpad .l{left:10px;top:50%;transform:translateY(-50%)}.dpad .r{right:10px;top:50%;transform:translateY(-50%)}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--steam);opacity:.85;border:3px solid #fff;pointer-events:none}
.acts{display:grid;grid-template-columns:repeat(2,min(72px,19vw));gap:min(10px,2.5vw);flex:none}
.act{font-family:var(--display);font-size:min(10px,2.6vw);width:min(72px,19vw);height:min(72px,19vw);border-radius:50%;background:var(--hot);color:#fff;border:3px solid #fff;touch-action:none;padding:0}
.act.sup{background:var(--gold);color:#1a0a10}
.act.rain{background:#e0a050;color:#1a0a10;grid-column:1/-1;justify-self:center}
.act.on{transform:scale(.92);filter:brightness(1.3)}
#btnMenu{position:absolute;left:50%;top:7cqw;transform:translateX(-50%);z-index:3;font-size:2cqw;padding:.8cqw 1.6cqw;opacity:.85}
.menucol{display:flex;flex-direction:column;gap:1.6cqw;align-items:stretch;width:34cqw}
.menucol .mini{font-size:1.9cqw;padding:1.4cqw}
#ovMenu{background:#120a1fe6;z-index:5}
/* mobile : la page devient une manette, sans le texte des touches du clavier */
body.touch .legend{display:none}
body.touch{padding-block:6px}
body.touch .cab{width:100%;min-width:0}
@media (orientation:landscape){
  body.touch .cab{width:min(100%,calc((100dvh - 12px) * 16 / 9))}
  body.touch .pad{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  body.touch .dpad,body.touch .act{pointer-events:auto;opacity:.62}
  body.touch .dpad{width:130px;height:130px}
  body.touch .acts{grid-template-columns:repeat(2,62px);gap:8px}
  body.touch .act{width:62px;height:62px}
}
@media (orientation:portrait){body.touch .pad{padding:14px 4px 0}}
/* téléphone à la verticale : 80 % pour le combat (caméra qui suit l'action), 20 % pour la manette */
@media (orientation:portrait){
  body.touch .cab{gap:6px}
  body.touch .screen{aspect-ratio:auto;width:100%;height:calc(80dvh - 12px)}
  body.touch .pad{height:calc(20dvh - 6px);padding:0 4px;box-sizing:border-box}
  body.touch .dpad{width:min(40vw,calc(20dvh - 14px));height:min(40vw,calc(20dvh - 14px))}
  body.touch .dpad .arr{font-size:13px}
  body.touch .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
  body.touch .acts{grid-template-columns:repeat(2,min(19vw,calc(10dvh - 10px)));gap:min(8px,1dvh) min(10px,2.5vw)}
  body.touch .act{width:min(19vw,calc(10dvh - 10px));height:min(19vw,calc(10dvh - 10px));font-size:min(10px,2.4vw)}
}
body.touch .ov{overflow-y:auto;justify-content:safe center}
/* téléphone à la verticale : les écrans de menu passent en plein écran, avec un texte à taille fixe et lisible */
@media (orientation:portrait){
  body.touch .ov{position:fixed;inset:0;z-index:30;background:var(--ink);gap:16px;justify-content:flex-start;
    padding:max(18px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-sizing:border-box}
  body.touch #ovTitle{justify-content:center;gap:26px;background:radial-gradient(circle at 50% 35%,#3a1c4e,var(--ink) 70%)}
  body.touch #ovMenu{justify-content:center}
  body.touch .logo b{font-size:30px}body.touch .logo i{font-size:22px}
  body.touch .logo .a{transform:translateX(-14px) skewX(-8deg)}body.touch .logo .b{transform:translateX(14px) skewX(-8deg)}
  body.touch .sub{font-size:9px;line-height:1.6;text-align:center}
  body.touch .btn{font-size:15px;padding:16px 22px}
  body.touch h2{font-size:15px;line-height:1.4}
  body.touch .cards{gap:6px;width:100%}
  body.touch .card{width:auto;flex:1 1 0;min-width:0;padding:10px 6px;gap:7px;border-width:3px}
  body.touch .vs{font-size:13px}
  body.touch .card .who{font-size:8px}body.touch .card .nm{font-size:12px}body.touch .card .tg{font-size:7px}
  body.touch .card .sp{font-size:7px;line-height:1.6;height:68px}body.touch .card .sw{font-size:7px}
  body.touch .card img{width:64px;height:64px}
  body.touch .roster{flex-wrap:wrap;gap:4px}body.touch .roster span{width:30px;height:30px;border-width:2px}
  body.touch .roster span img{width:100%;height:100%;border:0}
  body.touch #ovSelect,body.touch #ovWin,body.touch #ovMenu{background:var(--ink)}
  body.touch .vs{font-size:11px;flex:none}
  body.touch .card .nm{font-size:min(12px,3.2vw)}
  body.touch .maps{flex-wrap:wrap;gap:6px;width:100%}
  body.touch .map{font-size:7px;padding:4px;gap:4px;border-width:2px;width:calc((100% - 12px) / 3);box-sizing:border-box}
  body.touch .map img{width:100%}
  body.touch #ovSelect .row{width:100%;gap:8px}
  body.touch #ovSelect .row>button{width:calc(50% - 4px);height:46px;font-size:10px}
  body.touch #ovSelect #btnFight{width:100%;height:58px;font-size:17px;border-width:3px}
  body.touch .winner{flex-direction:column;text-align:center;gap:14px}
  body.touch .winner img{width:120px;height:120px}
  body.touch .winner .big{font-size:18px}body.touch .winner .q{font-size:20px;max-width:none}
  body.touch #ovWin .row{flex-direction:column;width:100%;gap:10px}body.touch #ovWin .row>button{width:100%}
  body.touch .mini{font-size:11px;padding:12px}
  body.touch .menucol{width:100%;gap:12px}body.touch .menucol .mini{font-size:13px;padding:14px}
}
@media (orientation:landscape){body.touch:not(.ingame) .pad{display:none}}
@media (max-width:560px){.legend{grid-template-columns:1fr}}
</style>

<div class="cab">
  <div class="screen" id="screen">
    <canvas id="cv" width="960" height="540" aria-label="Arène de combat"></canvas>
    <button class="mini" id="btnMenu" hidden aria-label="Pause et menu">II</button>
    <div class="ov" id="ovMenu" hidden>
      <h2>PAUSE</h2>
      <div class="menucol">
        <button class="btn" id="mResume">REPRENDRE</button>
        <button class="mini" id="mSound">SON ON</button>
        <button class="mini" id="mRestart">RESTART</button>
        <button class="mini" id="mHome">HOME</button>
      </div>
    </div>

    <div class="ov" id="ovTitle">
      <div class="logo"><b class="a" style="word-spacing:-.85em">BACK TO</b><i>THE</i><b class="b">FUTURE</b></div>
      
      <button class="btn big" id="btnStart">START FIGHT</button>
    </div>

    <div class="ov" id="ovSelect" hidden>
      <h2>CHOISIS TON COMBATTANT</h2>

        <button class="card p1" id="card0" aria-label="Changer le combattant du joueur 1"></button>

      </div>

        <button class="map" data-s="lac" aria-pressed="true"><img alt=""><span>MIRAGE D'ÉTHER</span></button>
        <button class="map" data-s="rue" aria-pressed="false"><img alt=""><span>L'ÉCHO DES ANCIENS</span></button>
        <button class="map" data-s="nuit" aria-pressed="false"><img alt=""><span>L'HEURE D'AMBRE</span></button>
        <button class="map" data-s="lune" aria-pressed="false"><img alt=""><span>LE SILENCE BLANC</span></button>
        <button class="map" data-s="volcan" aria-pressed="false"><img alt=""><span>L'ÉPREUVE DU FEU</span></button>
        <button class="map" data-s="iles" aria-pressed="false"><img alt=""><span>LA MARÉE HAUTE</span></button>
      </div>

                <button class="btn" id="btnFight">FIGHT !</button>

    </div>

  <div class="pad" id="pad" hidden>
    <div class="dpad" id="dpad" aria-label="Croix directionnelle"><span class="arr u">▲</span><span class="arr l">◀</span><span class="arr r">▶</span><span class="arr d">▼</span><span class="knob" id="knob"></span></div>
    <div class="acts">
      <button class="act" data-k="3" aria-label="Coup spécial">SPE</button><button class="act sup" data-k="4" aria-label="Attaque ultime">MAX</button><button class="act rain" data-k="5" aria-label="Pluie de baguettes" hidden>PLUIE</button>
      <button class="act" data-k="1" aria-label="Poing">POING</button><button class="act" data-k="2" aria-label="Pied">PIED</button>
    </div>
  </div>

  <div class="legend">
    <div class="keys p2"><h3>COMMANDES</h3><ul>
      <li><kbd class="ar">←</kbd><kbd class="ar">→</kbd> Bouger</li><li><kbd class="ar">↑</kbd> Sauter, + <kbd class="ar">←</kbd> ou <kbd class="ar">→</kbd> pour sauter de côté, 2 fois = double saut</li>
      <li><kbd class="ar">↓</kbd> Se baisser</li><li><kbd>1</kbd> Poing</li><li><kbd>2</kbd> Pied</li><li><kbd>3</kbd> Spécial</li>
      <li><kbd>4</kbd> Onde d'énergie (jauge pleine)</li><li><kbd>5</kbd> Baker : pluie de baguettes</li><li><kbd>Échap</kbd> Pause</li></ul></div>
    <p class="note"><button class="mini" id="mute" aria-pressed="false" aria-label="Couper le son">SON ON</button><button class="mini" id="btnRestart" hidden aria-label="Relancer le match depuis le round 1">RESTART</button><button class="mini" id="btnHome" hidden aria-label="Revenir à la page d'accueil">HOME</button></p>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   Back to the Future (BenSauna vs Baker) — jeu de combat 2D
   Sections : CONFIG · AUDIO · INPUT · PERSONNAGES · FIGHTER · FX · DÉCOR · JEU · UI
   ============================================================ */
const W=480,H=270,GROUND=240,GRAV=0.5,XMIN=22,XMAX=W-22;
const cv=document.getElementById('cv');let g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const INK='#1a1020';
const FONT='"Press Start 2P",monospace';

/* ---------------- AUDIO (synthé WebAudio, aucun fichier) ---------------- */
const A={ctx:null,on:true,master:null,
  init(){
    if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();this.master.gain.value=.45;this.master.connect(this.ctx.destination);}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
    if(this.ctx&&typeof VOICE!=='undefined'){VOICE.load();MUSIC.load();FART.load();}
  },
  ok(){return this.ctx&&this.on&&!G.demo},
  tone(f,d,type='square',v=.18,f2=null,delay=0){
    if(!this.ok())return;const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),ga=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
    ga.gain.setValueAtTime(v,t);ga.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(ga);ga.connect(this.master);o.start(t);o.stop(t+d+.02);
  },
  noise(d,v=.3,fc=1200,type='lowpass',delay=0,fc2=null){
    if(!this.ok())return;const c=this.ctx,t=c.currentTime+delay,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),ch=b.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(fc,t);
    if(fc2)fl.frequency.exponentialRampToValueAtTime(fc2,t+d);
    const ga=c.createGain();ga.gain.setValueAtTime(v,t);ga.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(fl);fl.connect(ga);ga.connect(this.master);s.start(t);
  },
  sfx(n){switch(n){
    case'whoosh':this.noise(.09,.12,2500,'bandpass',0,600);break;
    case'light':this.noise(.07,.35,1800);this.tone(220,.07,'square',.15,90);break;
    case'heavy':this.noise(.16,.5,900);this.tone(140,.18,'sawtooth',.25,40);break;
    case'block':this.tone(700,.05,'triangle',.2,500);this.noise(.04,.15,4000,'highpass');break;
    case'jump':this.tone(260,.12,'square',.08,520);break;
    case'steam':this.noise(.6,.35,5000,'highpass',0,1500);this.tone(900,.5,'sine',.06,300);break;
    case'baguette':[392,523,659,784].forEach((f,i)=>this.tone(f,.07,'square',.12,null,i*.045));this.noise(.3,.2,3000,'bandpass');break;
    case'crunch':this.noise(.2,.5,2600,'bandpass',0,500);this.tone(110,.2,'sawtooth',.25,45);break;
    case'ko':this.tone(400,.9,'sawtooth',.3,40);this.noise(.5,.4,700);break;
    case'bell':this.tone(1320,.5,'triangle',.25);this.tone(1760,.5,'sine',.15);break;
    case'ui':this.tone(660,.06,'square',.12,990);break;
    case'win':[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.14,'square',.14,null,i*.11));break;
    case'charge':this.tone(110,.6,'sawtooth',.14,760);this.tone(220,.6,'square',.05,1500);break;
    case'beam':this.noise(.9,.5,700,'lowpass',0,3200);this.tone(95,.9,'sawtooth',.28,60);this.tone(1300,.9,'sine',.07,500);break;
    case'fart':this.tone(70,.45,'sawtooth',.3,40);this.tone(110,.3,'square',.12,55,.05);this.noise(.5,.35,400,'lowpass',0,150);break;
    case'coo':this.tone(500,.1,'sine',.1,380);this.tone(480,.12,'sine',.1,350,.12);break;
  }},
  say(txt,big){ if(!this.on||G.demo)return; try{const u=new SpeechSynthesisUtterance(txt);
      if(big){ // grosse voix d'annonceur : anglais, très grave, lente
        u.lang='en-US';u.rate=.78;u.pitch=.05;u.volume=1;
        const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)),v=vs.find(v=>/male|david|daniel|george|alex|fred|mark|guy|ryan/i.test(v.name)&&!/female/i.test(v.name))||vs[0];if(v)u.voice=v;
      }else{u.lang='fr-FR';u.rate=1.15;u.pitch=.5;u.volume=.9;}
      speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} },
  // petite boucle chiptune pendant les combats
  step:0,
  tick(){
    if(!this.ok()||G.state!=='fight'||MUSIC.buf)return;   // la petite boucle chiptune ne sert que si la musique n'a pas pu se charger
    const s=this.step++%32,bass=[110,110,165,110,131,131,196,131,147,147,220,147,98,98,147,123];
    if(s%2===0)this.tone(bass[(s/2)|0],.11,'triangle',.16);
    const lead=[440,0,523,0,659,523,0,440,587,0,523,0,494,0,392,0,440,0,523,659,784,0,659,0,587,523,494,0,392,0,330,0];
    if(lead[s])this.tone(lead[s],.09,'square',.035);
    if(s%4===2)this.noise(.03,.06,6000,'highpass');
  }
};

/* ---------------- MUSIQUES : une par map ---------------- */
const MUSIC={bufs:{},files:{lac:'rock.mp3',rue:'music_rue.mp3',nuit:'music_nuit.mp3',lune:'music_lune.mp3',volcan:'music_volcan.mp3'},get buf(){return this.bufs[G.stage]||null;},src:null,gain:null,loading:false,vol:.3,
  load(){
    if(this.loading||!A.ctx)return;this.loading=true;
    this.gain=A.ctx.createGain();this.gain.gain.value=0;this.gain.connect(A.ctx.destination);
    for(const [st,file] of Object.entries(this.files))fetch(file).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>A.ctx.decodeAudioData(b)).then(b=>{this.bufs[st]=b;if(G.stage===st&&(G.state==='fight'||G.state==='ko'))this.start();}).catch(()=>{});
  },
  start(){ // démarre en boucle avec un court fondu ; ne redémarre pas si elle joue déjà
    if(!this.buf||this.src||!A.on||G.demo)return;
    const s=A.ctx.createBufferSource();s.buffer=this.buf;s.loop=true;s.connect(this.gain);s.start();this.src=s;
    const t=A.ctx.currentTime;this.gain.gain.cancelScheduledValues(t);this.gain.gain.setValueAtTime(0,t);this.gain.gain.linearRampToValueAtTime(this.vol,t+.6);
  },
  stop(fade=.5){
    if(!this.src)return;const s=this.src,t=A.ctx.currentTime;this.src=null;
    this.gain.gain.cancelScheduledValues(t);this.gain.gain.setValueAtTime(this.gain.gain.value,t);this.gain.gain.linearRampToValueAtTime(0,t+fade);
    try{s.stop(t+fade+.05);}catch(e){}
  },
  duck(on){ // baisse la musique pendant que l'annonceur parle
    if(!this.src)return;const t=A.ctx.currentTime;this.gain.gain.cancelScheduledValues(t);this.gain.gain.setValueAtTime(this.gain.gain.value,t);
    this.gain.gain.linearRampToValueAtTime(on?this.vol*.2:this.vol,t+(on?.08:.4));
  }
};

/* ---------------- BRUIT DU PET DE ROMAIN (fichier fart.mp3) ---------------- */
const FART={buf:null,loading:false,
  load(){if(this.loading||!A.ctx)return;this.loading=true;
    fetch('fart.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>A.ctx.decodeAudioData(b)).then(b=>{this.buf=b;}).catch(()=>{});},
  play(){
    if(!A.ok())return;
    if(!this.buf){A.sfx('fart');return;}
    const s=A.ctx.createBufferSource(),gn=A.ctx.createGain();gn.gain.value=1.3;s.buffer=this.buf;s.connect(gn);gn.connect(A.ctx.destination);s.start();
    MUSIC.duck(true);setTimeout(()=>MUSIC.duck(false),this.buf.duration*1000+250);   // la musique baisse le temps du pet
  }
};

const VOICE_TXT={round1:'Round one',round2:'Round two',round3:'Final round',fight:'Fight!',ko:'K.O.!',perfect:'Perfect!',timeover:'Time over',draw:'Draw game',
  versus:'versus',thegreat:'the great',wins:'wins!',youwin:'You win!',youlose:'You lose'};
const VOICE={buf:{},seq:0,gain:null,loading:false,
  load(){ // décodage une seule fois, après le premier clic (contexte audio actif)
    if(this.loading||!A.ctx)return;this.loading=true;
    this.gain=A.ctx.createGain();this.gain.gain.value=1;this.gain.connect(A.ctx.destination);
    for(const k in VOICE_MP3){const s=atob(VOICE_MP3[k]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
      A.ctx.decodeAudioData(u.buffer).then(b=>{this.buf[k]=b;}).catch(()=>{});}
  },
  clip(k,id){return new Promise(res=>{const b=this.buf[k];if(!b||id!==this.seq)return res();MUSIC.duck(true);setTimeout(()=>{if(id===this.seq)MUSIC.duck(false);},Math.max(150,(b.duration-.3)*1000));
    const s=A.ctx.createBufferSource();s.buffer=b;s.connect(this.gain);s.start();this.src=s;
    setTimeout(res,Math.max(150,(b.duration-.42)*1000));});},
  tts(text,id){return new Promise(res=>{if(id!==this.seq)return res();A.say(text,true);
    let done=false;const fin=()=>{if(!done){done=true;res();}};setTimeout(fin,1600);
    try{const iv=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(iv);setTimeout(fin,60);}},80);}catch(e){fin();}});},
  // joue une suite : clés d'enregistrements ('fight') ou {tts:'texte'}
  async play(items){
    if(!A.on||G.demo)return;const id=++this.seq;
    try{this.src&&this.src.stop();}catch(e){}
    for(const it of items){if(id!==this.seq)return;
      if(typeof it==='string'&&this.buf[it])await this.clip(it,id);
      else await this.tts(typeof it==='string'?(VOICE_TXT[it]||it):it.tts,id);}
  },
  name(ch){return this.buf['nom_'+ch.id]?'nom_'+ch.id:{tts:ch.spoken};},
  frames(k){const b=this.buf[k];return (b&&A.on&&!G.demo)?Math.ceil((b.duration-.42)*60):0;}
};

const held=new Set();
const buf=[{punch:0,kick:0,special:0,up:0,super:0,super2:0},{punch:0,kick:0,special:0,up:0,super:0,super2:0}];
const MAP=[
  {left:['q','a'],right:['d'],up:['z','w'],down:['s'],punch:['f'],kick:['g'],special:['h'],super:['j'],super2:['k']},
  {left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],
   punch:['Digit1','Numpad1','1','&'],kick:['Digit2','Numpad2','2','é'],special:['Digit3','Numpad3','3','"'],super:['Digit4','Numpad4','4',"'"],super2:['Digit5','Numpad5','5','(']}
];
const kid=e=>e.key.length===1?e.key.toLowerCase():e.key;
// contre le CPU, le joueur 1 peut aussi jouer avec les flèches et les chiffres
const mapsFor=p=>p===0?[MAP[1]]:[];   // le joueur (à gauche) joue aux flèches et aux chiffres ; l'adversaire est le CPU
function press(ids){
  for(let p=0;p<2;p++)for(const a of ['punch','kick','special','up','super','super2'])
    if(mapsFor(p).some(m=>m[a].some(k=>ids.includes(k))))buf[p][a]=7;
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const ids=[kid(e),e.code];
  if(/^Arrow|^ $/.test(e.key))e.preventDefault();
  if(e.repeat)return;
  ids.forEach(k=>held.add(k));press(ids);
  UI.key(e,ids);
});
addEventListener('keyup',e=>{held.delete(kid(e));held.delete(e.code);
  if(e.key.length===1){held.delete(e.key.toUpperCase());}
  // les touches chiffres en AZERTY changent de "key" avec Maj : on nettoie par code
  if(e.code==='Digit1'){held.delete('1');held.delete('&');}
  if(e.code==='Digit2'){held.delete('2');held.delete('é');}
  if(e.code==='Digit3'){held.delete('3');held.delete('"');}
});
addEventListener('blur',()=>held.clear());
const isHeld=(p,a)=>mapsFor(p).some(m=>m[a].some(k=>held.has(k)));
function humanInput(p){
  const b=buf[p];
  return {left:isHeld(p,'left'),right:isHeld(p,'right'),down:isHeld(p,'down'),
    up:b.up>0,punch:b.punch>0,kick:b.kick>0,special:b.special>0,super:b.super>0,super2:b.super2>0,use(a){b[a]=0;}};
}
const noInput={left:0,right:0,down:0,up:0,punch:0,kick:0,special:0,super:0,use(){}};

        }
      }
      if(this.state==='attack'&&this.atk===a&&a.f>=end&&(!mv.air||this.grounded)){this.state='free';this.atk=null;}
    }
    else if(this.state==='hurt'){
      target=POSES.hurt;rate=.6;this.vx*=.82;
      if(--this.stun<=0){this.state='free';}
    }
    else if(this.state==='down'){
      target=POSES.down;rate=.18;
      if(this.grounded){
        this.vx*=.8;
        if(!this.dead&&--this.downT<=0){this.state='free';this.invuln=34;}
      }
    }
    else if(this.state==='win'){this.vx=0;target=this.ch.id==='ben'?POSES.benWin:POSES.win;rate=.2;this.dir=this.side?-1:1;}
    else if(this.state==='lose'){this.vx=0;target=POSES.lose;rate=.12;}

    // physique
    if(!this.grounded&&(this.state==='free'||(this.state==='attack'&&this.atk.mv.air))){ // contrôle en l'air
      const ax=(inp.right?1:0)-(inp.left?1:0);if(ax)this.vx+=(ax*this.ch.walk*1.4-this.vx)*.14;
    }
    if(!this.grounded||this.vy<0){this.vy+=GRAV;this.y+=this.vy;}
    this.x+=this.vx;
    if(this.y>=GROUND){
      this.y=GROUND;this.vy=0;
      if(!wasGround){
        FX.dust(this.x,GROUND);
        if(this.state==='attack'&&this.atk.mv.air){if(this.atk.mv.land){this.atk={name:'lag',mv:LANDLAG,f:0,hit:true,blocked:false};this.vx=0;}else{this.state='free';this.atk=null;}}
        if(this.state==='down'){G.shake=Math.max(G.shake,5);A.sfx('light');G.scarePigeons();}
      }
    }
    this.x=clamp(this.x,XMIN,XMAX);

    // pose procédurale + interpolation
    let tp=target;
    if(target===POSES.idle){
      tp=target.slice();const b=Math.sin(this.t/11);
      if(this.moving){const s=Math.sin(this.walkPh),c=Math.cos(this.walkPh);
        tp[6]=10+28*s;tp[7]=-24-12*c;tp[8]=4-28*s;tp[9]=-24+12*c;tp[0]=10;}
      tp[0]+=b*1.5;tp[3]+=b*5;tp[5]-=b*4;
    }else if(this.state==='win'){tp=target.slice();const b=Math.sin(this.t/6);tp[2]+=b*10;tp[4]-=b*(this.ch.id==='ben'?0:10);tp[7]-=Math.abs(b)*14;tp[9]-=Math.abs(b)*14;}
    for(let i=0;i<11;i++)this.pose[i]+=(tp[i]-this.pose[i])*rate;
  }
  expr(){
    if(this.dead||this.state==='down'||this.state==='lose')return 'ko';
    if(this.state==='hurt')return 'hurt';
    if(this.state==='win')return 'win';
    if(this.state==='attack')return this.atk&&this.atk.mv.mouth?'fire':'atk';
    return 'idle';
  }
}

/* ---------------- TOUCHES / DÉGÂTS ---------------- */
const WORDS=['PAF!','BIM!','TCHAK!','PAN!','BOUM!','VLAN!'];
function hit(att,def,mv,x,y,srcX){
  if(def.invuln>0||def.state==='down'||def.state==='win'||G.state!=='fight')return false;
  const facing=Math.sign(srcX-def.x)===def.dir||srcX===def.x;
  if(def.blocking&&def.grounded&&facing&&def.state==='free'){
    def.hp=Math.max(1,def.hp-(mv.chip??Math.ceil(mv.dmg*.15)));def.vx=-def.dir*(mv.kb*.9);def.meter=Math.min(100,def.meter+4);
    att.meter=Math.min(100,att.meter+3);
    G.hitstop=mv.stop??4;A.sfx('block');FX.spark(x,y,'#9fd8ff',5);if(!mv.flat)FX.text(x,y-14,'GARDE','#9fd8ff',28);
    return 'block';
  }
  const inCombo=def.state==='hurt'&&def.stun>0;
  att.combo=inCombo?att.combo+1:1;att.comboT=90;
  const dmg=Math.round((mv.flat?mv.dmg:Math.max(2,Math.round(mv.dmg*Math.pow(.86,att.combo-1))))*(def.ch.def||1));
  def.hp=Math.max(0,def.hp-dmg);def.flash=5;def.blocking=false;def.atk=null;
  att.meter=Math.min(100,att.meter+dmg*1.3);def.meter=Math.min(100,def.meter+dmg*.9);
  const dirK=Math.sign(def.x-srcX)||att.dir;
  const kd=mv.kd||(!mv.flat&&att.combo>=5)||def.hp<=0||!def.grounded;
  if(kd){def.state='down';def.vy=-5.8;def.y-=1;def.vx=dirK*(mv.kb+1.2);def.downT=42;def.stun=0;}
  else{def.state='hurt';def.stun=mv.stun;def.vx=dirK*mv.kb;}
  if((def.x<=XMIN+2||def.x>=XMAX-2)&&att.grounded)att.vx=-dirK*mv.kb*.8;
  G.hitstop=mv.stop??(mv.heavy?9:5);G.shake=Math.max(G.shake,mv.heavy?7:3);G.cheer=30;
  A.sfx(mv.snd||'light');
  FX.spark(x,y,mv.heavy?'#ffd23f':'#fff',mv.heavy?12:7);
  if((mv.heavy||att.combo>1)&&!mv.flat)FX.text(x+rnd(-8,8),y-16,mv.snd==='crunch'?'CROUSTI!':WORDS[(Math.random()*WORDS.length)|0],'#fff',34,true);
  if(mv.snd==='crunch')for(let i=0;i<10;i++)FX.crumb(x,y);
  if(def.hp<=0){def.dead=true;G.endRound(att,'ko');}
  return 'hit';
}

const FX={list:[],
  add(o){this.list.push(o);},
  spark(x,y,c,n){this.add({k:'ring',x,y,t:0,life:10,c});for(let i=0;i<n;i++){const a=rnd(6.28),s=rnd(1.5,4.5);this.add({k:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rnd(8,16),c,s:rnd(1,3)});}},
  puff(x,y,vx,vy,c='#ffffff'){this.add({k:'puff',x,y,vx,vy,t:0,life:rnd(18,30),c,s:rnd(3,7)});},
  dust(x,y){for(let i=0;i<5;i++)this.puff(x+rnd(-8,8),y-2,rnd(-1.2,1.2),rnd(-.6,0),'#d9c6b0');},
  crumb(x,y){this.add({k:'dot',x,y,vx:rnd(-3,3),vy:rnd(-4,-1),g:.3,t:0,life:rnd(18,30),c:rnd()<.5?'#e2a85a':'#f6dfae',s:2});},
  text(x,y,s,c,life,pop){this.add({k:'txt',x:clamp(x,40,W-40),y,s,c,t:0,life,pop});},
  update(){for(const p of this.list){p.t++;if(p.vx!==undefined){p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;else{p.vx*=.92;p.vy*=.92;}}if(p.k==='puff')p.y-=.25;if(p.k==='txt')p.y-=.35;}
    this.list=this.list.filter(p=>p.t<p.life);},
  draw(){for(const p of this.list){const a=1-p.t/p.life;
    if(p.k==='dot'){g.fillStyle=p.c;g.globalAlpha=a;g.fillRect(p.x|0,p.y|0,p.s,p.s);}
    else if(p.k==='puff'){g.fillStyle=p.c;g.globalAlpha=a*.7;g.beginPath();g.arc(p.x,p.y,p.s*(1+p.t/p.life),0,7);g.fill();}
    else if(p.k==='ring'){g.strokeStyle=p.c;g.globalAlpha=a;g.lineWidth=2;g.beginPath();
      for(let i=0;i<8;i++){const an=i*.785,r0=3+p.t*1.4,r1=r0+5;g.moveTo(p.x+Math.cos(an)*r0,p.y+Math.sin(an)*r0);g.lineTo(p.x+Math.cos(an)*r1,p.y+Math.sin(an)*r1);}g.stroke();}
    else if(p.k==='txt'){g.globalAlpha=Math.min(1,a*3);const sz=p.pop?(p.t<4?16:8):8;txt(p.s,p.x,p.y,sz,p.c,'center');}
    g.globalAlpha=1;}}
};
const TXT_CACHE=new Map(),TXT_MEASURE=document.createElement('canvas').getContext('2d'),TXT_RES=3;
function txtBitmap(s,size,color,shadow){
  const k=s+'|'+size+'|'+color+'|'+shadow;let b=TXT_CACHE.get(k);if(b)return b;
  TXT_MEASURE.font=size+'px '+FONT;const w=Math.ceil(TXT_MEASURE.measureText(s).width)+4,hh=size+5;
  const c=document.createElement('canvas');c.width=w*TXT_RES;c.height=hh*TXT_RES;const x=c.getContext('2d');
  x.scale(TXT_RES,TXT_RES);x.font=size+'px '+FONT;x.textBaseline='top';const o=size>=16?2:1;
  x.fillStyle=shadow;x.fillText(s,2+o,2+o);x.fillText(s,2-o,2);x.fillText(s,2+o,2);x.fillText(s,2,2-o);x.fillStyle=color;x.fillText(s,2,2);
  b={c,w,h:hh};if(TXT_CACHE.size>500)TXT_CACHE.clear();TXT_CACHE.set(k,b);return b;
}

  g.fillStyle='rgba(255,250,200,.6)';for(let i=0;i<8;i++){g.fillRect((i*67+t*.4)%W,181+(i*5)%18,8,.8);}

    g.fillStyle='#ff7a1a';g.beginPath();g.arc(x,y,7,Math.PI,0);g.fill();g.fillRect(x-7,y-1,14,up?5:3);
    g.fillStyle='#ffd24a';g.beginPath();g.arc(x-2,y-3,3,0,7);g.fill();g.fillStyle='rgba(60,14,10,.8)';g.fillRect(x+2,y-5,3,2);g.fillRect(x-6,y-1,3,2);
    g.fillStyle='#fff';g.fillRect(x-3.5,y-5,2.4,3);g.fillRect(x+1.5,y-5,2.4,3);g.fillStyle='#1a0606';g.fillRect(x-2.5,y-4,1.2,1.6);g.fillRect(x+2.5,y-4,1.2,1.6);
    if(up){g.fillStyle='#3a0d14';g.fillRect(x-1.5,y-1,3,2);}
  }
  // fissures incandescentes qui pulsent
  g.lineCap='round';g.lineJoin='round';
  CRACKS.forEach((c,i)=>{const a=.45+.35*Math.sin(t/18+i*1.3);g.strokeStyle='rgba(255,110,30,'+a*.4+')';g.lineWidth=3.4;g.beginPath();c.forEach((q,j)=>j?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();
    g.strokeStyle='rgba(255,200,90,'+a+')';g.lineWidth=1.1;g.stroke();});
  // bouche du four sacré
  const fl=.6+.25*Math.sin(t/5)+.1*Math.sin(t/1.6);g.fillStyle='rgba(255,120,30,'+fl+')';g.beginPath();g.arc(404,192,12,Math.PI,0);g.fill();g.fillRect(392,191,24,8);
  g.fillStyle='rgba(255,230,120,'+fl+')';g.beginPath();g.arc(404,195,6,Math.PI,0);g.fill();
  // torches
  for(const [x,y] of TORCHES){g.fillStyle='#2a1810';g.fillRect(x-1.5,y,3,9);g.fillStyle='#4a3020';g.fillRect(x-3,y-1,6,3);
    const f=Math.sin(t/3+x)*1.2;g.fillStyle='rgba(255,140,40,.25)';g.beginPath();g.arc(x,y-6,10,0,7);g.fill();

  if(t%3===0)SCENE.embers.push({x:rnd(W),y:H+2,vx:rnd(-.3,.3),vy:-rnd(.5,1.2),t:0});

  g.globalAlpha=1;SCENE.embers=SCENE.embers.filter(e=>e.t<220&&e.y>-5);

/* ---------------- IA ---------------- */
function aiInput(me,opp,st){
  const inp={left:0,right:0,down:0,up:0,punch:0,kick:0,special:0,super:0,use(){}};
  const d=Math.abs(opp.x-me.x),tw=opp.x>me.x?'right':'left',aw=opp.x>me.x?'left':'right';
  st.t=(st.t||0)-1;
  const kar=!!me.ch.gest;
  if(st.t<=0){st.t=8+rnd(16);st.fire=true;const r=Math.random(),hasM=true;
    if(d>120)st.m=r<.55?'go':r<.7?'jump':r<.92&&hasM?'sp':'wait';
    else if(d>52)st.m=r<.5?'go':r<.68&&hasM?'sp':r<.82?'kick':r<.92?'jump':'back';
    else st.m=(opp.blocking||opp.crouch)&&r<.6?'throw':r<.3?'punch':r<.56?'kick':r<.68?'throw':r<.82?'block':r<.9?'back':hasM?'sp':'punch';}
  const threat=(opp.state==='attack'&&d<75)||G.proj.some(p=>p.owner!==me&&Math.abs(p.x-me.x)<60);
  const pj=G.proj.some(p=>p.owner!==me);
  if(threat&&!st.react){st.react=true;const r=Math.random();if(r<.45){st.m='block';st.t=14;}else if(pj&&r<.75){st.m='duck';st.t=26;}}
  if(!threat)st.react=false;
  if(me.meter>=100&&d>70&&me.grounded&&st.fire&&Math.random()<.5)inp.super=1;if(me.ch.rain&&!G.rain&&st.fire&&Math.random()<.04)inp.super2=1;
  if(kar&&me.grounded&&!opp.grounded&&d<80&&opp.vy>-3&&Math.random()<.35){inp.dp=1;inp.punch=1;return inp;}
  if(kar&&me.grounded&&d>60&&d<150&&st.fire&&Math.random()<.12){inp.qcb=1;inp.kick=1;st.fire=false;return inp;}
  switch(st.m){
    case'go':inp[tw]=1;break;case'back':inp[aw]=1;break;case'block':inp[aw]=1;break;case'duck':inp.down=1;break;case'throw':inp[tw]=1;if(st.fire||d<40)inp.punch=1;break;
    case'jump':inp[tw]=1;if(st.fire)inp.up=1;if(!me.grounded&&!me.dj&&me.vy>-1&&d>90&&Math.random()<.08)inp.up=1;if(!me.grounded&&me.vy>0&&d<60)inp.kick=1;break;
    case'sp':if(st.fire)inp.special=1;break;
    case'punch':if(st.fire)inp.punch=1;break;case'kick':if(st.fire)inp.kick=1;break;}
  st.fire=false;
  if(me.atk&&me.atk.hit&&!me.atk.blocked&&Math.random()<.22){if(me.atk.name==='punch')inp[Math.random()<.5?'punch':'kick']=1;else inp.special=1;}
  return inp;
}

/* ---------------- JEU ---------------- */
const G={state:'title',demo:true,mode:'cpu',stage:'lac',sel:['ben','boul'],p:[],proj:[],round:1,timer:0,t:0,frame:0,
  hitstop:0,shake:0,cheer:0,flashT:0,winner:null,endKind:'',ai:[{},{}],
  startMatch(demo,skipIntro){
    this.demo=demo;
    this.p=[new Fighter(CHARS[this.sel[0]],0,false),new Fighter(CHARS[this.sel[1]],1,this.sel[0]===this.sel[1])];
    this.round=1;
    if(demo||skipIntro)this.startRound();
    else{this.state='versus';this.t=0;this.proj=[];FX.list=[];this.winner=null;this.hitstop=0;this.timer=60*60;}   // présentation avant le premier round
  },
  startRain(owner){
    this.rain={owner,t:0,items:[]};
    FX.text(owner.x,owner.y-118,'PLUIE DE BAGUETTES !','#ffd23f',80,true);
    A.sfx('baguette');A.sfx('charge');this.flashT=6;this.shake=Math.max(this.shake,4);
  },
  stepRain(){
    const r=this.rain;if(!r)return;r.t++;
    const opp=this.p[0]===r.owner?this.p[1]:this.p[0];
    if(r.t<=180&&r.t%4===0)for(let k=0;k<(r.t%15===0?2:1);k++)
      r.items.push({x:clamp(opp.x+rnd(-140,140),12,W-12),y:-190-rnd(60),vy:rnd(1,2.5),rot:rnd(6.28),vr:rnd(-.18,.18),dead:false});
    const hb=opp.hurtbox();
    for(const it of r.items){it.vy=Math.min(9,it.vy+.22);it.y+=it.vy;it.rot+=it.vr;
      if(it.x>hb.x0-12&&it.x<hb.x1+12&&it.y>hb.y0&&it.y<hb.y1){
        if(hit(r.owner,opp,RAINHIT,it.x,it.y,r.owner.x)){it.dead=true;for(let i=0;i<6;i++)FX.crumb(it.x,it.y);}}
      if(!it.dead&&it.y>=GROUND-3){it.dead=true;for(let i=0;i<5;i++)FX.crumb(it.x,GROUND-3);if(Math.random()<.3)A.sfx('light');}}
    r.items=r.items.filter(it=>!it.dead);
    if(r.t>180&&!r.items.length)this.rain=null;
  },
  startRound(){
    this.rain=null;
    this.p.forEach(f=>f.reset());this.proj=[];FX.list=[];this.timer=60*60;this.state='intro';this.t=0;this.winner=null;
    this.hitstop=0;const rk=this.round===1?'round1':this.round===2?'round2':'round3';VOICE.play([rk]);this.fightAt=Math.max(70,VOICE.frames(rk)+14);
  },
  endRound(winner,kind){
    if(this.state!=='fight')return;
    this.state='ko';this.t=0;this.winner=winner;this.endKind=kind;
    if(kind==='ko'){A.sfx('ko');VOICE.play(['ko']);this.hitstop=14;this.shake=10;this.scarePigeons();}
    else{A.sfx('bell');VOICE.play(winner?['timeover']:['timeover','draw']);}
  },
  scarePigeons(){for(const p of SCENE.pigeons)if(p.st===0){p.st=1;p.t=0;p.d=Math.random()<.5?-1:1;}if(!this.demo)A.sfx('coo');},
  inputFor(i){
    if(this.state!=='fight')return noInput;
    if(this.demo||(this.mode==='cpu'&&i===1))return aiInput(this.p[i],this.p[1-i],this.ai[i]);
    return humanInput(i);
  },
  snap(){ // positions de l'image précédente, pour l'interpolation à l'affichage
    for(const f of this.p){f.px=f.x;f.py=f.y;}for(const p of this.proj)p.px=p.x;
    if(this.rain)for(const it of this.rain.items){it.px=it.x;it.py=it.y;}
  },
  step(){
    this.snap();
    if(this.paused)return;
    this.frame++;
    for(const b of buf)for(const k in b)if(b[k]>0)b[k]--;
    if(this.shake>0)this.shake*=.85,this.shake<.4&&(this.shake=0);
    if(this.cheer>0)this.cheer--;if(this.flashT>0)this.flashT--;
    if(this.state==='title'&&!this.p.length)return;
    if(this.hitstop>0){this.hitstop--;FX.update();return;}
    if(this.state==='ko'&&this.t<50&&this.endKind==='ko'&&this.frame%2)return; // ralenti
    this.t++;
    const [a,b]=this.p;
    const ia=this.inputFor(0),ib=this.inputFor(1);
    a.update(ia,b);b.update(ib,a);
    // en portrait, l'écran suit les deux combattants : celui qui recule est bloqué au bord de l'image
    if(CAM.on){const d=b.x-a.x,s=Math.sign(d)||1;if(Math.abs(d)>CAM_SEP){
      if(s*b.vx>=-s*a.vx)b.x=clamp(a.x+s*CAM_SEP,XMIN,XMAX);else a.x=clamp(b.x-s*CAM_SEP,XMIN,XMAX);
      if(Math.abs(b.x-a.x)>CAM_SEP){const m=(a.x+b.x)/2;a.x=m-s*CAM_SEP/2;b.x=m+s*CAM_SEP/2;}}}
    // séparation des corps
    if(Math.abs(a.y-b.y)<50&&a.state!=='down'&&b.state!=='down'){
      const dx=b.x-a.x,min=26;if(Math.abs(dx)<min){const push=(min-Math.abs(dx))/2,s=dx>=0?1:-1;
        a.x=clamp(a.x-s*push,XMIN,XMAX);b.x=clamp(b.x+s*push,XMIN,XMAX);
        if(Math.abs(b.x-a.x)<min){if(a.x<=XMIN||a.x>=XMAX)b.x=clamp(a.x+s*min,XMIN,XMAX);else a.x=clamp(b.x-s*min,XMIN,XMAX);}}}
    // projectiles
    for(const p of this.proj){p.t++;p.x+=p.vx;if(p.t%2===0)FX.puff(p.x-Math.sign(p.vx)*8,p.y+rnd(-6,6),-p.vx*.2,rnd(-.3,.3));
      const o=p.owner===a?b:a,h=o.hurtbox();
      if(p.x+11>h.x0&&p.x-11<h.x1&&p.y+10>h.y0&&p.y-10<h.y1){if(hit(p.owner,o,p.hit||PROJ,p.x,p.y,p.x-p.vx*3)){p.dead=true;for(let i=0;i<12;i++)FX.puff(p.x,p.y,rnd(-3,3),rnd(-3,2));}}
      if(p.x<-20||p.x>W+20)p.dead=true;}
    for(const p of this.proj)for(const q of this.proj)if(p!==q&&p.owner!==q.owner&&!p.dead&&!q.dead&&Math.abs(p.x-q.x)<18&&Math.abs(p.y-q.y)<26){
      p.dead=q.dead=true;this.hitstop=4;A.sfx('block');FX.spark((p.x+q.x)/2,(p.y+q.y)/2,'#fff',12);for(let i=0;i<10;i++)FX.puff((p.x+q.x)/2,(p.y+q.y)/2,rnd(-3,3),rnd(-3,2));}
    this.proj=this.proj.filter(p=>!p.dead);
    this.stepRain();
    FX.update();

    if(this.state==='versus'){
      if(this.t===1)this.vsEnd=250;
      if(this.t===2){A.sfx('whoosh');A.tone(70,.5,'sawtooth',.2,45);}
      if(this.t===10){const seq=[VOICE.name(this.p[0].ch),'versus',VOICE.name(this.p[1].ch)];VOICE.play(seq);
        // la présentation dure le temps que l'annonceur prononce tout, plus une petite marge
        const fr=seq.reduce((s,k)=>s+(typeof k==='string'?VOICE.frames(k):0),0);this.vsEnd=fr?Math.max(170,10+fr+40):250;}
      if(this.t===46){A.sfx('heavy');A.tone(60,.9,'sawtooth',.3,28);this.shake=9;this.flashT=10;}
      if(this.t===84)A.sfx('bell');
      if(this.t>=(this.vsEnd||250))this.startRound();
    }else if(this.state==='intro'){
      if(this.t===this.fightAt){A.sfx('bell');VOICE.play(['fight']);}
      if(this.t>=this.fightAt+Math.max(42,VOICE.frames('fight'))){this.state='fight';MUSIC.start();}
    }else if(this.state==='fight'){
      if(--this.timer<=0){
        const w=a.hp===b.hp?null:(a.hp>b.hp?a:b);this.endRound(w,'time');
      }
    }else if(this.state==='ko'){
      const w=this.winner;
      if(this.t===112&&this.winner&&this.winner.hp>=100&&this.endKind==='ko')VOICE.play(['perfect']);
      if(this.t===75){
        if(w){if(w.grounded||true){w.state='win';w.atk=null;}const l=w===a?b:a;if(!l.dead){l.state='lose';l.atk=null;l.blocking=false;}A.sfx('win');}
      }
      if(this.t>=250){
        if(w){w.wins++;
          if(w.wins>=2){this.matchEnd(w);return;}
        }
        this.round++;this.startRound();
      }
    }
  },
  matchEnd(w){
    if(this.demo){this.startMatch(true);return;}
    this.state='matchEnd';MUSIC.stop(1.2);UI.showWin(w);VOICE.play(this.mode==='cpu'?[w.side===0?'youwin':'youlose']:[VOICE.name(w.ch),'wins']);
  }
};

/* ---------------- HUD ---------------- */
function drawHud(){
  const [a,b]=G.p;
  const bar=(f,x,flip)=>{
    const w=170,y=13,h=11;
    g.fillStyle='#000';g.fillRect(x-2,y-2,w+4,h+4);g.fillStyle='#fff';g.fillRect(x-1,y-1,w+2,h+2);g.fillStyle='#8a1030';g.fillRect(x,y,w,h);
    const wl=w*f.hpLag/100,wh=w*f.hp/100;
    g.fillStyle='#fff';g.fillRect(flip?x:x+w-wl,y,wl,h);
    g.fillStyle=f.hp<25&&(G.frame&8)?'#ff7a3d':'#ffd23f';g.fillRect(flip?x:x+w-wh,y,wh,h);
    g.fillStyle='rgba(255,255,255,.45)';g.fillRect(flip?x:x+w-wh,y+1,wh,2);
  };
  bar(a,36,false);bar(b,274,true);
  // portraits
  [[a,8],[b,450]].forEach(([f,x])=>{g.fillStyle='#000';g.fillRect(x-2,7,26,26);g.fillStyle=f.side?'#f2a65a':'#7fe7ff';g.fillRect(x-1,8,24,24);
    g.imageSmoothingEnabled=true;g.drawImage(PORTRAIT[f.ch.id],x,9,22,22);g.imageSmoothingEnabled=false;});
  txt(a.ch.name,36,29,8,'#7fe7ff','left');txt(b.ch.name,444,29,8,'#f2a65a','right');
  // rounds gagnés
  for(let i=0;i<2;i++){

    if(f.combo>=4)txt(f.combo>=5?'CARNAGE !':'JOLI !',x,TOUCH?88:78,8,'#fff',al);}});

function drawBust(ch,ex,t,shirt){
  g.lineJoin='round';g.fillStyle=shirt;g.strokeStyle=INK;g.lineWidth=1.3;
  g.beginPath();g.moveTo(-34,40);g.quadraticCurveTo(-28,21,-9,18);g.lineTo(9,18);g.quadraticCurveTo(28,21,34,40);g.closePath();g.fill();g.stroke();
  g.fillStyle=ch.neck||ch.skinD;g.fillRect(-6,12,12,9);
  const SP=SPRITE[ch.id];
  if(SP&&SP.ready){const fc=SP.meta.face[0];g.save();g.beginPath();g.ellipse(0,-2,23,27,0,0,7);g.clip();g.imageSmoothingEnabled=true;g.drawImage(SP.img,fc[0],fc[1],fc[2],fc[3],-26,-30,52,52);g.restore();
    g.strokeStyle=INK;g.lineWidth=1.3;g.beginPath();g.ellipse(0,-2,23,27,0,0,7);g.stroke();return;}
  drawHead(ch,ex,t);
}
function drawVersus(){
  const t=G.t,[a,b]=G.p,ease=x=>1-Math.pow(1-clamp(x,0,1),3),k=ease(t/24),off=(1-k)*280,slam=t>=46;

  // deux panneaux en biais qui claquent depuis les bords
  g.save();g.translate(-off,0);panel([[-300,0],[252,0],[192,H],[-300,H]],'#2a8fb0','#12384f');
  g.fillStyle='rgba(255,255,255,.10)';for(let i=0;i<12;i++)g.fillRect(((t*11+i*71)%330)-90,(i*23+7)%H,60+(i%3)*30,2);
  g.save();g.translate(112,112+Math.sin(t/9)*1.5);g.scale(4.4,4.4);drawBust(a.ch,slam?'atk':'idle',t,a.alt?a.ch.shirtAlt:a.ch.shirt);g.restore();g.restore();
  g.save();g.translate(off,0);panel([[288,0],[W+300,0],[W+300,H],[228,H]],'#f0a040','#8a3a1c');
  g.fillStyle='rgba(255,255,255,.10)';for(let i=0;i<12;i++)g.fillRect(W-(((t*11+i*71)%330)-90)-80,(i*23+15)%H,60+(i%3)*30,2);
  g.save();g.translate(368,112+Math.sin(t/9+2)*1.5);g.scale(-4.4,4.4);drawBust(b.ch,slam?'atk':'idle',t,b.alt?b.ch.shirtAlt:b.ch.shirt);g.restore();g.restore();
  // éclair dans la faille centrale
  if(slam&&t%7<4){g.strokeStyle='#fff';g.lineWidth=2;g.lineJoin='miter';g.beginPath();let x=270;g.moveTo(x,0);for(let y=18;y<=H;y+=18){x=270-y*.222+((y*7+t*13)%17-8);g.lineTo(x,y);}g.stroke();
    g.strokeStyle='rgba(255,210,63,.5)';g.lineWidth=5;g.stroke();}
  // noms
  g.fillStyle='rgba(8,4,20,.75)';g.fillRect(0,206,W,44);
  txt(a.ch.name,112-off,218,16,'#7fe7ff','center');
  if(t>=84){const p2=Math.min(1,(t-84)/8);g.globalAlpha=p2;g.globalAlpha=1;}
  txt(b.ch.name,368+off,218,16,'#f2a65a','center');
  if(slam){const s=1+Math.max(0,(60-t)/14)*2.4;g.save();g.translate(240,108);g.scale(s,s);txt('VS',2,-24,48,(t&8)?'#ffd23f':'#fff','center','#b3202a');g.restore();}
  const fe=(G.vsEnd||250)-22;if(t>fe){g.fillStyle='rgba(255,255,255,'+Math.min(1,(t-fe)/18)+')';g.fillRect(0,0,W,H);}
}

/* ---------------- RENDU ---------------- */
// caméra : en mode portrait sur téléphone, le canvas prend la forme de l'écran et zoome sur les deux combattants
const CAM={on:false,z:0,cx:240},CAM_VW=215,CAM_SEP=170;
const SKY={iles:'#2f8fe0',lac:'#2a78cc',rue:'#2b1a4f',nuit:'#050a26',lune:'#02030a',volcan:'#14040c'};
function fitCanvas(){
  const port=typeof TOUCH!=='undefined'&&TOUCH&&innerHeight>innerWidth;
  if(port){const r=$('screen').getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
    if(w>0&&h>0&&(cv.width!==w||cv.height!==h)){cv.width=w;cv.height=h;CAM.z=0;}CAM.on=true;}
  else{if(cv.width!==960||cv.height!==540){cv.width=960;cv.height=540;}CAM.on=false;}
}
function lerpWorld(al,on){ // place (ou remet) les objets entre leur position précédente et actuelle
  const L=(a,b)=>a===undefined?b:a+(b-a)*al;
  if(on){for(const f of G.p){f.rx=f.x;f.ry=f.y;f.x=L(f.px,f.x);f.y=L(f.py,f.y);}for(const p of G.proj){p.rx=p.x;p.x=L(p.px,p.x);}
    if(G.rain)for(const it of G.rain.items){it.rx=it.x;it.ry=it.y;it.x=L(it.px,it.x);it.y=L(it.py,it.y);}}
  else{for(const f of G.p){f.x=f.rx;f.y=f.ry;}for(const p of G.proj)p.x=p.rx;if(G.rain)for(const it of G.rain.items){it.x=it.rx;it.y=it.ry;}}
}
let FIT_DIRTY=true;
addEventListener('resize',()=>FIT_DIRTY=true);addEventListener('orientationchange',()=>{FIT_DIRTY=true;setTimeout(()=>FIT_DIRTY=true,250);});
function render(){
  if(FIT_DIRTY||(G.frame%90===0)){FIT_DIRTY=false;fitCanvas();}
  const al=G.paused||G.hitstop>0?1:Math.max(0,Math.min(1,acc/STEP_MS));
  lerpWorld(al,true);
  try{renderFrame();}finally{lerpWorld(al,false);}
}
function renderFrame(){
  let hs=2,vh=270;
  if(CAM.on){
    const cw=cv.width,chh=cv.height,zMax=chh/270;hs=cw/480;
    const z=Math.min(zMax,cw/CAM_VW);
    CAM.z=CAM.z?CAM.z+(z-CAM.z)*.1:z;const vw=cw/CAM.z;vh=chh/CAM.z;
    const mid=G.p.length?(G.p[0].x+G.p[1].x)/2:240,tx=Math.max(vw/2,Math.min(480-vw/2,mid));
    CAM.cx=CAM.cx+(tx-CAM.cx)*.15;CAM.cx=Math.max(vw/2,Math.min(480-vw/2,CAM.cx));
    g.setTransform(CAM.z,0,0,CAM.z,-(CAM.cx-vw/2)*CAM.z,(vh-270)*CAM.z);
    if(vh>270){g.fillStyle=SKY[G.stage]||'#000';g.fillRect(CAM.cx-vw/2-4,270-vh-4,vw+8,vh-270+6);}
  }else g.setTransform(2,0,0,2,0,0);
  g.imageSmoothingEnabled=false;
  g.save();
  if(G.shake>0)g.translate(Math.round(rnd(-G.shake,G.shake)),Math.round(rnd(-G.shake,G.shake)*.6));
  drawScene(G.frame);
  const sp=G.p.some(f=>f.atk&&f.atk.name==='super');G.dark=(G.dark||0)+((sp?.5:0)-(G.dark||0))*.15;
  if(G.dark>.01){g.fillStyle='rgba(10,5,35,'+G.dark+')';g.fillRect(-20,-20-(vh-270),W+40,vh+40);}
  if(G.p.length){
    const [a,b]=G.p,front=(b.state==='attack'||a.state==='down'||a.state==='hurt')?b:a,back=front===a?b:a;
    drawFighter(back);drawFighter(front);
    G.proj.forEach(drawProj);
    if(G.rain){ // ombres au sol qui annoncent les impacts, puis les baguettes en pixel art
      for(const it of G.rain.items){const k=clamp(1-(GROUND-it.y)/400,0,1);g.fillStyle='rgba(20,8,30,'+(.15+.35*k)+')';g.beginPath();g.ellipse(it.x,GROUND+2,6+12*k,2.5,0,0,7);g.fill();}
      g.imageSmoothingEnabled=false;
      for(const it of G.rain.items){g.save();g.translate(it.x,it.y);g.rotate(it.rot);g.drawImage(BAGUETTE_PX,-22*PX*.4,-6*PX*.4,22*PX*.8,6*PX*.8);g.restore();}
    }
    FX.draw();
  }
  g.restore();
  g.setTransform(1,0,0,1,0,0);
  if(G.flashT>0){g.fillStyle='rgba(255,255,255,'+(G.flashT/14)+')';g.fillRect(0,0,cv.width,cv.height);}
  if(G.p.length&&!G.demo){
    if(G.state==='versus'){if(CAM.on){g.fillStyle='#120a1f';g.fillRect(0,0,cv.width,cv.height);}g.setTransform(hs,0,0,hs,0,CAM.on?(cv.height-270*hs)/2:0);drawVersus();}
    else{g.setTransform(hs,0,0,hs,0,0);drawHud();}
  }
}
// boucle : simulation à pas fixe de 60 Hz, affichage à la fréquence de l'écran (60, 90, 120 Hz…) avec interpolation
const STEP_MS=1000/60;
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,Math.max(0,now-last));last=now;
  let n=0;while(acc>=STEP_MS&&n<5){G.step();acc-=STEP_MS;n++;}
  if(n===5&&acc>=STEP_MS)acc=0;   // appareil trop lent : on ne court pas après le retard
  render();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;FIT_DIRTY=true;});

/* ---------------- UI (écrans) ---------------- */
const UI={
  screen:'title',
  show(name){this.screen=name;{const r=document.querySelector('.act.rain');if(r)r.hidden=!(G.sel[0]==='boul');}FIT_DIRTY=true;document.body.classList.toggle('ingame',name==='game');$('btnMenu').hidden=!(TOUCH&&name==='game');if(name!=='game'&&G.paused)MENU.close();$('btnHome').hidden=name==='title';$('btnRestart').hidden=name==='title'||name==='select';$('ovTitle').hidden=name!=='title';$('ovSelect').hidden=name!=='select';$('ovWin').hidden=name!=='win';
    const foc={title:'btnStart',select:'btnFight',win:'btnAgain'}[name];if(foc)$(foc).focus({preventScroll:true});else document.activeElement&&document.activeElement.blur();},
  card(i){const c=CHARS[G.sel[i]];
    $('card'+i).innerHTML=`<span class="who">${i?(G.mode==='cpu'?'CPU':'JOUEUR 2'):'JOUEUR 1'}</span><img src="${c.img}" alt="Portrait de ${c.name}">
      <span class="nm">${c.name}</span><span class="tg">${c.tag}</span><span class="sp">${c.gest?c.desc:'SPECIAL : '+c.special+'<br>'+c.desc}</span>
      <span class="roster">${ROSTER.map(k=>`<span data-c="${k}" class="${k===G.sel[i]?'on':''}" title="${CHARS[k].name}"><img src="${CHARS[k].img}" alt="${CHARS[k].name}"></span>`).join('')}</span>
      <span class="sw">${TOUCH||i?'TOUCHE UN VISAGE':'◀ ▶ : CHANGER'} · ${ROSTER.indexOf(G.sel[i])+1}/${ROSTER.length}</span>`;},
  refresh(){G.mode='cpu';this.card(0);this.card(1);document.querySelectorAll('.map').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===G.stage));},
  swap(i,d=1){const n=ROSTER.length;G.sel[i]=ROSTER[(ROSTER.indexOf(G.sel[i])+d+n)%n];A.sfx('ui');this.card(i);},
  toSelect(){A.init();G.demo=true;A.on&&0;this.refresh();this.show('select');G.demo=false;A.sfx('ui');G.demo=true;},
  fight(){A.init();this.show('game');G.startMatch(false);},

  key(e,ids){
    if(this.screen==='select'){
      if(ids.includes('ArrowLeft'))this.swap(0,-1);if(ids.includes('ArrowRight'))this.swap(0,1);
    }
    if(ids.includes('m'))$('mute').click();
  }
};

// pavé tactile (joueur 1) sur écrans tactiles
// ----- version mobile : manette tactile, pause, menu -----
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0);
if(TOUCH){
  document.body.classList.add('touch');$('pad').hidden=false;G.mode='cpu';
  const setHeld=(k,on)=>{if(on)held.add(k);else held.delete(k);};
  const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
  // croix directionnelle
  const dp=$('dpad'),knob=$('knob');let pid=null,upWas=false;
  const dir=(x,y)=>{const r=dp.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2;
    let dx=(x-cx)/R,dy=(y-cy)/R;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
    knob.style.transform=`translate(${dx*R*.55}px,${dy*R*.55}px)`;
    const L=dx<-.38,Rt=dx>.38,U=dy<-.48,D=dy>.42;
    setHeld('ArrowLeft',L);setHeld('ArrowRight',Rt);setHeld('ArrowDown',D);
    if(U&&!upWas){press(['ArrowUp']);vib(8);}upWas=U;};
  const release=()=>{pid=null;upWas=false;['ArrowLeft','ArrowRight','ArrowDown'].forEach(k=>held.delete(k));knob.style.transform='';};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{dp.setPointerCapture(pid);}catch(_){}dir(e.clientX,e.clientY);});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();dir(e.clientX,e.clientY);}});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])dp.addEventListener(ev,e=>{if(e.pointerId===pid)release();});
  // boutons d'action (plusieurs doigts à la fois)
  document.querySelectorAll('.act').forEach(b=>{const k=b.dataset.k;
    const dn=e=>{e.preventDefault();A.init();held.add(k);press([k]);b.classList.add('on');vib(12);},
          up=e=>{e.preventDefault();held.delete(k);b.classList.remove('on');};
    b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);});
  // le menu contextuel du navigateur ne doit pas s'ouvrir sur un appui long
  $('pad').addEventListener('contextmenu',e=>e.preventDefault());
}

};
